name: onedrop
description: OneDrop — send any file to a nearby phone or PC.
publish_to: "none"
version: 1.0.6+10006

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  aml_ui:
    path: ../../global-assets/packages/aml_ui
  air_gesture:
    path: ../packages/air_gesture
  drop_p2p:
    path: ../packages/drop_p2p

  cupertino_icons: ^1.0.8
  desktop_drop: ^0.5.0
  file_picker: ^8.3.7
  launch_at_startup: ^0.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  photo_manager: ^3.9.0
  video_thumbnail: ^0.5.6
  screen_retriever: ^0.2.0
  shared_preferences: ^2.5.5
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  tray_manager: ^0.5.0
  video_player: ^2.11.1
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
